name: Size

on:
  pull_request:
    branches: [main, master, dev]

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Check bundle size
        run: |
          echo "📦 Bundle sizes:"
          for pkg in packages/*/dist; do
            if [ -d "$pkg" ]; then
              echo "$(dirname $pkg | xargs basename):"
              du -sh "$pkg"/*
            fi
          done
